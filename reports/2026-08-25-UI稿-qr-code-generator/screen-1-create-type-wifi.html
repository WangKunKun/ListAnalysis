</div>
<!-- Input: Password -->
<div class="flex flex-col gap-sm relative">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all" type="password" value="secretpassword123"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>

<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Security</label>

<button class="flex-1 py-2 rounded font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">WEP</button>
