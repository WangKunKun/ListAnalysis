<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>QuickQR - Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom styles for the scanning frame animation */
        @keyframes scan-line {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-scan-line {
            animation: scan-line 2s linear infinite;
        }
        
        /* Bottom sheet entrance animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#dce2f7",
                        "surface-container-highest": "#dce2f3",
                        "secondary": "#575e70",
                        "error-container": "#ffdad6",
                        "primary": "#3525cd",
                        "secondary-fixed-dim": "#c0c6db",
                        "outline": "#777587",
                        "tertiary-fixed": "#ffdbcc",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-container-low": "#f0f3ff",
                        "on-primary-container": "#dad7ff",
                        "surface-container-high": "#e2e8f8",
                        "on-error": "#ffffff",
                        "on-background": "#151c27",
                        "background": "#f9f9ff",
                        "inverse-on-surface": "#ebf1ff",
                        "surface": "#f9f9ff",
                        "surface-dim": "#d3daea",
                        "on-primary": "#ffffff",
                        "surface-variant": "#dce2f3",
                        "surface-container": "#e7eefe",
                        "tertiary": "#7e3000",
                        "outline-variant": "#c7c4d8",
                        "secondary-container": "#d9dff5",
                        "tertiary-container": "#a44100",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "surface-tint": "#4d44e3",
                        "on-tertiary-container": "#ffd2be",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#141b2b",
                        "on-surface-variant": "#464555",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9ff",
                        "primary-fixed": "#e2dfff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#404758",
                        "on-secondary-container": "#5c6274",
                        "inverse-surface": "#2a313d",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#c3c0ff",
                        "primary-container": "#4f46e5",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "on-tertiary-fixed": "#351000",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-surface": "#151c27"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "base": "4px",
                        "lg": "24px",
                        "xl": "40px",
                        "gutter": "20px",
                        "md": "16px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "code": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "code": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full w-full overflow-hidden bg-black flex flex-col font-body-md text-on-surface">
<!-- Top App Bar (Hidden on mobile per layout anchor, but included for completeness if needed on larger screens. Suppressed here as it's a dedicated scanner view.) -->
<!-- Suppressed TopAppBar to prioritize the camera canvas -->
<!-- Main Viewfinder Area -->
<main class="relative flex-1 w-full h-full">
<!-- Simulated Camera Background (Dark placeholder) -->
<div class="absolute inset-0 bg-neutral-900 overflow-hidden z-0">
<div class="w-full h-full bg-cover bg-center opacity-40" data-alt="A blurred, dark, moody photograph of a bustling modern coffee shop interior, serving as the out-of-focus background for a camera viewfinder. High-end aesthetic with subtle bokeh lights in the distance. The lighting is low and warm, creating a contrast for a digital overlay." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAaHr1TFSZ17JMCGOq0mZtF1l73BsdbXbRt1nNmKoEciTTvq689fuvoyPaBMFbIgZC7qhg9bl5dAGJSUujrrmRbSAhYKD9-6b82y1CFsunhmympTbGSSjwn5DKS7g3GPTHLum6-_TsZYCcT-JK5hyHAPoi8SwXAZ5fawG50EucO3pxLEdshl1q_7IL97PEcbot4bwUM2z21uOAdQApiDvZwTSJLlMQLnDdHQWEyqH1cLKCMv96l9pUyMpTf1SVYWM0y0t4MWrzRK2Q')"></div>
</div>
<!-- Viewfinder Overlay Elements -->
<div class="absolute inset-0 flex flex-col items-center justify-center z-10 pointer-events-none px-margin-mobile">
<!-- Caption -->
<div class="mb-lg">
<p class="font-body-lg text-body-lg text-white/90 bg-black/40 px-4 py-2 rounded-full backdrop-blur-sm shadow-sm">
                    Point at a QR code
                </p>
</div>
<!-- Scanning Frame -->
<div class="relative w-[280px] h-[280px]">
<!-- Darkened outer area simulation (CSS border trick) -->
<div class="absolute -inset-[1000px] border-[1000px] border-black/50 pointer-events-none"></div>
<!-- Frame Corner Brackets -->
<!-- Top Left -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<!-- Top Right -->
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<!-- Bottom Left -->
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<!-- Bottom Right -->
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Scanning Line Animation -->
<div class="absolute w-full h-[2px] bg-primary shadow-[0_0_8px_2px_rgba(79,70,229,0.5)] animate-scan-line pointer-events-none"></div>
<!-- Torch Icon Button (Top Right of Frame) -->
<button class="absolute -top-12 -right-4 pointer-events-auto bg-black/40 text-white rounded-full p-2 backdrop-blur-sm hover:bg-black/60 transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-size: 24px;">flashlight_on</span>
</button>
</div>
</div>
<!-- Album Button (Bottom Left area of viewfinder) -->
<div class="absolute bottom-40 left-margin-mobile z-10">
<button class="flex items-center gap-2 bg-black/40 text-white font-label-sm text-label-sm px-4 py-2 rounded-full backdrop-blur-sm hover:bg-black/60 transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined" style="font-size: 18px;">photo_library</span>
                Album
            </button>
</div>
</main>
<!-- Bottom Sheet (Scan Result) -->
<!-- Z-index 40 to sit below BottomNavBar (z-50) -->
<div class="fixed bottom-[72px] left-0 w-full z-40 px-2 pb-2 slide-up pointer-events-none">
<div class="bg-surface w-full max-w-container-max mx-auto rounded-t-xl rounded-b-xl shadow-[0px_10px_25px_rgba(0,0,0,0.1)] p-lg flex flex-col gap-md pointer-events-auto border border-outline-variant/30">
<!-- Drag Handle / Grabber -->
<div class="w-12 h-1.5 bg-outline-variant rounded-full mx-auto mb-2 opacity-50"></div>
<!-- Result Type Badge -->
<div class="flex items-center gap-2">
<div class="bg-secondary-fixed text-on-secondary-fixed w-8 h-8 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-size: 16px;">wifi</span>
</div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">WiFi Network</span>
</div>
<!-- Network Name -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate">
                CoffeeShop_5G
            </h2>
<!-- Action Buttons -->
<div class="flex items-center gap-sm mt-sm">
<!-- Primary Action -->
<button class="flex-1 bg-primary-container text-on-primary rounded-lg py-3 px-4 font-label-sm text-label-sm flex items-center justify-center gap-2 hover:bg-primary-container/90 transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-size: 18px;">wifi_password</span>
                    Join Network
                </button>
<!-- Secondary Actions (Icon Buttons) -->
<button aria-label="Copy Details" class="w-[48px] h-[48px] bg-surface-container-high text-on-surface flex items-center justify-center rounded-lg hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined">content_copy</span>
</button>
<button aria-label="Create QR from this" class="w-[48px] h-[48px] bg-surface-container-high text-on-surface flex items-center justify-center rounded-lg hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined">add_circle</span>
</button>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe bg-surface dark:bg-on-background shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] z-50">
<!-- Tab: Create -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-secondary-container transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add_circle</span>
<span class="font-label-sm text-label-sm mt-1">Create</span>
</a>
<!-- Tab: Scan (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-secondary-container transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-label-sm text-label-sm mt-1">Scan</span>
</a>
<!-- Tab: History -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-secondary-container transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</a>
<!-- Tab: Settings -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-secondary-container transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</a>
</nav>
</body></html>
