<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>QuickQR - Create</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#ebf1ff",
                        "tertiary-fixed-dim": "#ffb695",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#7e3000",
                        "on-tertiary": "#ffffff",
                        "on-background": "#151c27",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f0f3ff",
                        "primary-fixed": "#e2dfff",
                        "on-surface": "#151c27",
                        "surface-container-high": "#e2e8f8",
                        "on-primary-container": "#dad7ff",
                        "tertiary-fixed": "#ffdbcc",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-surface-variant": "#464555",
                        "on-secondary-fixed": "#141b2b",
                        "secondary-container": "#d9dff5",
                        "on-primary": "#ffffff",
                        "surface-container": "#e7eefe",
                        "surface": "#f9f9ff",
                        "on-secondary-fixed-variant": "#404758",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#351000",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "secondary-fixed-dim": "#c0c6db",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "on-primary-fixed": "#0f0069",
                        "surface-dim": "#d3daea",
                        "inverse-primary": "#c3c0ff",
                        "outline-variant": "#c7c4d8",
                        "outline": "#777587",
                        "surface-variant": "#dce2f3",
                        "secondary-fixed": "#dce2f7",
                        "primary-fixed-dim": "#c3c0ff",
                        "primary": "#3525cd",
                        "surface-container-highest": "#dce2f3",
                        "tertiary-container": "#a44100",
                        "on-secondary-container": "#5c6274",
                        "on-tertiary-container": "#ffd2be",
                        "surface-tint": "#4d44e3",
                        "primary-container": "#4f46e5",
                        "on-secondary": "#ffffff",
                        "background": "#f9f9ff",
                        "secondary": "#575e70",
                        "inverse-surface": "#2a313d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "md": "16px",
                        "container-max": "1200px",
                        "xl": "40px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "gutter": "20px",
                        "base": "4px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "code": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "code": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #FAFAFC;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .qr-placeholder {
            background: repeating-linear-gradient(
                45deg,
                #151c27,
                #151c27 10px,
                #ffffff 10px,
                #ffffff 20px
            );
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-md pb-[120px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface shadow-sm">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-container-max mx-auto">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="qr_code_2" data-weight="fill">qr_code_2</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">QuickQR</h1>
</div>
<button class="p-sm rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="px-margin-mobile pt-lg max-w-container-max mx-auto flex flex-col gap-xl">
<!-- Header Section -->
<div class="flex justify-between items-end">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile">Create</h2>
</div>
<!-- Segmented Control -->
<div class="w-full overflow-x-auto hide-scrollbar pb-sm">
<div class="flex gap-sm w-max bg-surface-container-low p-base rounded-full border border-outline-variant/30">
<button class="px-md py-sm rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">URL</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">Text</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">WiFi</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">Contact</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm bg-primary-container text-on-primary shadow-sm transition-colors">SMS</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">Phone</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">Email</button>
</div>
</div>
<!-- Form Area -->
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="phone">Phone number</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-md font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="phone" type="tel" value="+1 555 0123"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="message">Message</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-md font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm resize-none" id="message" rows="3">Meet me at the coffee shop at 3?</textarea>
</div>
</div>
<!-- QR Preview Area -->
<div class="bg-surface-container-lowest rounded-[16px] p-lg shadow-[0_4px_12px_rgba(0,0,0,0.05)] flex flex-col items-center gap-md border border-outline-variant/20">
<!-- Simulated High Contrast QR -->
<div class="w-48 h-48 bg-on-background rounded-lg p-sm flex items-center justify-center relative overflow-hidden group cursor-pointer shadow-sm">
<div class="absolute inset-0 bg-white grid grid-cols-6 grid-rows-6 gap-xs p-xs">
<!-- Fake QR blocks -->
<div class="bg-on-background rounded-sm col-span-2 row-span-2 relative">
<div class="absolute inset-1 bg-white rounded-sm"><div class="absolute inset-1 bg-on-background rounded-sm"></div></div>
</div>
<div class="bg-on-background rounded-sm col-start-5 col-span-2 row-span-2 relative">
<div class="absolute inset-1 bg-white rounded-sm"><div class="absolute inset-1 bg-on-background rounded-sm"></div></div>
</div>
<div class="bg-on-background rounded-sm col-start-1 col-span-2 row-start-5 row-span-2 relative">
<div class="absolute inset-1 bg-white rounded-sm"><div class="absolute inset-1 bg-on-background rounded-sm"></div></div>
</div>
<!-- Random blocks -->
<div class="bg-on-background rounded-sm col-start-3 row-start-1"></div>
<div class="bg-on-background rounded-sm col-start-4 row-start-2"></div>
<div class="bg-on-background rounded-sm col-start-3 row-start-3 col-span-2 row-span-2"></div>
<div class="bg-on-background rounded-sm col-start-6 row-start-3"></div>
<div class="bg-on-background rounded-sm col-start-1 row-start-4"></div>
<div class="bg-on-background rounded-sm col-start-5 row-start-5"></div>
<div class="bg-on-background rounded-sm col-start-4 row-start-6"></div>
<div class="bg-on-background rounded-sm col-start-6 row-start-6"></div>
</div>
</div>
<p class="font-code text-code text-on-surface-variant font-medium tracking-wider">ECC Level M · Version 3</p>
<button class="mt-sm flex items-center gap-sm text-primary hover:text-primary-fixed transition-colors font-label-sm text-label-sm active:scale-95">
<span class="material-symbols-outlined text-[18px]" data-icon="palette">palette</span>
                Customize Style
            </button>
</div>
</main>
<!-- Bottom Actions -->
<div class="fixed bottom-[72px] left-0 w-full px-margin-mobile pb-md z-40 bg-gradient-to-t from-surface via-surface to-transparent pt-lg">
<div class="max-w-container-max mx-auto">
<button class="w-full bg-primary-container text-on-primary font-label-sm text-label-sm py-4 rounded-lg shadow-md hover:bg-primary transition-colors active:scale-[0.98] flex items-center justify-center gap-sm">
<span>Export</span>
<span class="material-symbols-outlined text-[18px]" data-icon="ios_share">ios_share</span>
</button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface shadow-[0_-4px_12px_rgba(0,0,0,0.05)] md:hidden">
<div class="flex justify-around items-center py-2 px-4 max-w-container-max mx-auto w-full">
<!-- Active Tab: Create -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-primary rounded-full px-4 py-1 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="add_box" data-weight="fill">add_box</span>
<span class="font-label-sm text-label-sm mt-1">Create</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-sm text-label-sm mt-1">Scan</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</div>
</nav>
</body></html>
