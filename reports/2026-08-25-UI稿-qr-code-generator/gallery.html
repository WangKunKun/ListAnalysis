<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI 稿浏览 · 二维码生成器(5 默认 + 10 状态)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, "PingFang SC", "Inter", sans-serif;
    background: #FAFAFC; color: #111827;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6B7280; margin-bottom: 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 760px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: #fff; border: 1px solid #E5E7EB; border-radius: 12px;
    padding: 10px; cursor: zoom-in; transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(17,24,39,.10); }
  .card img {
    width: 100%; display: block; border-radius: 6px;
    border: 1px solid #F3F4F6;
  }
  .label { font-size: 12px; line-height: 1.5; margin-top: 8px; }
  .label b { display: block; font-size: 12.5px; }
  .label span { color: #6B7280; font-size: 11.5px; }
  .default .label b::after {
    content: "默认"; margin-left: 6px; font-size: 10px; font-weight: 600;
    color: #4F46E5; background: #EEF2FF; border-radius: 4px; padding: 1px 5px;
    vertical-align: 1px;
  }
  #overlay {
    position: fixed; inset: 0; background: rgba(15,17,23,.88);
    display: none; align-items: center; justify-content: center;
    cursor: zoom-out; z-index: 10; padding: 32px;
  }
  #overlay img { max-height: 92vh; max-width: 92vw; border-radius: 8px; }
  #overlay .cap {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #F3F4F6; font-size: 13px; background: rgba(0,0,0,.45);
    padding: 4px 14px; border-radius: 999px;
  }
</style>
</head>
<body>
<h1>个性化二维码生成器 · UI 设计稿</h1>
<div class="sub">21 屏 = 5 默认态 + 10 状态变体 + 6 类型表单变体 · 一行 6 个,超出换行 · 点击放大(←/→ 切换,Esc 关闭)</div>
<div class="grid" id="grid"></div>
<div id="overlay"><img id="big" alt=""><div class="cap" id="cap"></div></div>
<script>
const screens = [
  ["screen-1-create.png",             "Screen 1 · 创建页",        "URL 类型:输入框 + 实时预览 + Export"],
  ["screen-1-create-type-text.png",   "Screen 1 · 创建页",        "Text 类型:多行文本区"],
  ["screen-1-create-type-wifi.png",   "Screen 1 · 创建页",        "WiFi 类型:SSID/密码/加密三行"],
  ["screen-1-create-type-contact.png","Screen 1 · 创建页",        "Contact 类型:姓名/电话/邮箱三行"],
  ["screen-1-create-type-sms.png",    "Screen 1 · 创建页",        "SMS 类型:号码 + 消息内容"],
  ["screen-1-create-type-phone.png",  "Screen 1 · 创建页",        "Phone 类型:电话号码"],
  ["screen-1-create-type-email.png",  "Screen 1 · 创建页",        "Email 类型:邮箱 + 主题"],
  ["screen-1-create-empty.png",       "Screen 1 · 创建页",        "空态:灰占位码 + 禁用 Export"],
  ["screen-1-create-warning.png",     "Screen 1 · 创建页",        "警告态:低对比 amber 条 (F-P0-03)"],
  ["screen-2-style-editor.png",       "Screen 2 · 样式编辑器",    "Color tab:色板 + 渐变 + HEX"],
  ["screen-2-style-editor-dots.png",  "Screen 2 · 样式编辑器",    "Dots tab:6 种码点形状"],
  ["screen-2-style-editor-eyes.png",  "Screen 2 · 样式编辑器",    "Eyes tab:4 种眼睛样式"],
  ["screen-2-style-editor-logo.png",  "Screen 2 · 样式编辑器",    "Logo tab:来源 + 安全区提示"],
  ["screen-3-scan.png",               "Screen 3 · 扫码页",        "识别成功:WiFi 结果卡 + 动作组"],
  ["screen-3-scan-scanning.png",      "Screen 3 · 扫码页",        "识别前:纯取景器 + 扫描线"],
  ["screen-4-history.png",            "Screen 4 · 历史页",        "列表态:缩略图 + 左滑删除"],
  ["screen-4-history-empty.png",      "Screen 4 · 历史页",        "空态:插画 + 去创建"],
  ["screen-4-history-multiselect.png","Screen 4 · 历史页",        "多选态:勾选 + 批量操作栏"],
  ["screen-5-settings.png",           "Screen 5 · 设置页",        "未付费:$6.99 解锁卡"],
  ["screen-5-settings-unlocked.png",  "Screen 5 · 设置页",        "已付费:绿勾 + Restore"],
  ["screen-paywall-sheet.png",        "付费 Sheet",               "遮罩 + 权益 + Unlock/Not now (N-06)"],
];
const defaults = new Set(["screen-1-create.png","screen-2-style-editor.png","screen-3-scan.png","screen-4-history.png","screen-5-settings.png"]);
const grid = document.getElementById("grid");
let cur = 0;
screens.forEach(([file, name, state], i) => {
  const d = document.createElement("div");
  d.className = "card" + (defaults.has(file) ? " default" : "");
  d.innerHTML = `<img src="${file}" loading="lazy" alt="${name}">
    <div class="label"><b>${name}</b><span>${state}</span></div>`;
  d.onclick = () => show(i);
  grid.appendChild(d);
});
const ov = document.getElementById("overlay"), big = document.getElementById("big"), cap = document.getElementById("cap");
function show(i) {
  cur = i;
  big.src = screens[i][0];
  cap.textContent = screens[i][1] + " — " + screens[i][2];
  ov.style.display = "flex";
}
ov.onclick = () => ov.style.display = "none";
document.addEventListener("keydown", e => {
  if (ov.style.display !== "flex") return;
  if (e.key === "Escape") ov.style.display = "none";
  if (e.key === "ArrowRight") show((cur + 1) % screens.length);
  if (e.key === "ArrowLeft") show((cur - 1 + screens.length) % screens.length);
});
</script>
</body>
</html>
