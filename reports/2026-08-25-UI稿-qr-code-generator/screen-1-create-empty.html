</a>

<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>

<script>
        // Simple input interaction for preview state change
        const urlInput = document.getElementById('url-input');
        const exportBtns = document.querySelectorAll('button:has(span.material-symbols-outlined:contains("download"))');
        const previewCard = document.querySelector('.bg-surface-container-lowest.aspect-square');
        const placeholderIcon = previewCard.querySelector('.material-symbols-outlined');
        const placeholderText = previewCard.querySelector('p');
        const placeholderPattern = previewCard.querySelector('.border-dashed');

        urlInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length > 8 && val !== 'https://') { // Basic check beyond placeholder
                // Enable button
                exportBtns.forEach(btn => {
                    btn.removeAttribute('disabled');
                    btn.classList.remove('bg-[#E5E7EB]', 'text-[#9CA3AF]', 'cursor-not-allowed');
                    btn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:bg-surface-tint', 'cursor-pointer');
                });
                // Update preview visual subtly
                placeholderPattern.classList.replace('border-outline-variant', 'border-primary/50');
                placeholderIcon.classList.replace('text-outline-variant', 'text-primary/70');
                placeholderText.textContent = "Preview updating...";
                placeholderText.classList.replace('text-on-surface-variant', 'text-primary');
            } else {
                // Revert
                exportBtns.forEach(btn => {
                    btn.setAttribute('disabled', 'true');
                    btn.classList.add('bg-[#E5E7EB]', 'text-[#9CA3AF]', 'cursor-not-allowed');
                    btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'hover:bg-surface-tint', 'cursor-pointer');
                });
                placeholderPattern.classList.replace('border-primary/50', 'border-outline-variant');
                placeholderIcon.classList.replace('text-primary/70', 'text-outline-variant');
                placeholderText.textContent = "Enter content to generate a QR code";
                placeholderText.classList.replace('text-primary', 'text-on-surface-variant');
            }
        });
        
        // Polyfill for :contains selector used above for simplicity in vanilla JS example
        HTMLElement.prototype.containsText = function(text) {
             return this.textContent.includes(text);
        };
    </script>
