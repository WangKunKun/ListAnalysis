<style>
        /* Hide scrollbar for segmented control but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<body class="bg-background text-on-background h-full font-body-md flex flex-col items-center">
<!-- Top App Bar (Hidden on Mobile, Visible on md+) -->
<header class="hidden md:flex w-full top-0 sticky bg-surface shadow-sm z-40 justify-between items-center px-gutter py-sm max-w-[1200px]">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="qr_code_2" style="font-variation-settings: 'FILL' 1;">qr_code_2</span>
<span class="font-headline-md text-headline-md font-bold text-primary">IndigoQR</span>
</div>
<nav class="flex gap-lg">
<a class="text-primary font-bold hover:bg-surface-container transition-colors rounded-lg px-3 py-2" href="#">Create</a>
<a class="text-on-surface-variant hover:bg-surface-container transition-colors rounded-lg px-3 py-2" href="#">Scan</a>
<a class="text-on-surface-variant hover:bg-surface-container transition-colors rounded-lg px-3 py-2" href="#">History</a>
<a class="text-on-surface-variant hover:bg-surface-container transition-colors rounded-lg px-3 py-2" href="#">Settings</a>
</nav>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[1200px] flex-1 flex flex-col md:px-gutter px-margin-mobile pt-lg pb-24 md:pb-lg overflow-y-auto">
<!-- Header Section (Mobile specific styling logic applied here as well for simplicity) -->
<div class="flex justify-between items-end mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">Create</h1>
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
<!-- Segmented Control (Horizontally Scrollable) -->
<div class="w-full overflow-x-auto no-scrollbar mb-xl pb-2">
<div class="flex gap-2 min-w-max bg-surface-container-low p-1 rounded-xl shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)]">
<button class="px-4 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">URL</button>
<button class="px-4 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">Text</button>
<button class="px-4 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">WiFi</button>
<button class="px-4 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">Contact</button>
<button class="px-4 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">SMS</button>
<button class="px-4 py-2 rounded-lg font-label-sm text-label-sm bg-primary-container text-on-primary shadow-sm transition-transform active:scale-95">Phone</button>
<button class="px-4 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">Email</button>
</div>
</div>
<!-- Bento Grid Layout for Content -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-lg h-full content-start">
<!-- Left Column: Input Form -->
<div class="md:col-span-7 flex flex-col gap-lg">
<!-- Phone Number Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Phone number</label>
<div class="relative w-full">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 font-body-lg text-body-lg text-on-background focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-[0px_2px_4px_rgba(0,0,0,0.02)] pl-4 pr-12" type="tel" value="+1 555 0147"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline" data-icon="dialpad">dialpad</span>
</div>
</div>
<!-- Action Button -->
<button class="self-start flex items-center gap-2 text-primary-container font-label-sm text-label-sm hover:bg-primary-container/10 px-3 py-2 rounded-lg transition-colors active:scale-95 mt-sm">
<span class="material-symbols-outlined text-[18px]" data-icon="palette">palette</span>
                    Customize Style
                </button>
</div>
<!-- Right Column: Preview Area -->
<div class="md:col-span-5 flex flex-col items-center gap-md">
<!-- Preview Card -->
<div class="w-full max-w-[300px] bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-lg flex flex-col items-center justify-center gap-md">
<!-- Placeholder for actual QR code rendering -->
<div class="w-48 h-48 bg-surface-container-high rounded-lg flex items-center justify-center relative overflow-hidden">
<!-- Abstract placeholder for QR -->
<div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, #4F46E5 25%, transparent 25%, transparent 75%, #4F46E5 75%, #4F46E5), repeating-linear-gradient(45deg, #4F46E5 25%, transparent 25%, transparent 75%, #4F46E5 75%, #4F46E5); background-position: 0 0, 10px 10px; background-size: 20px 20px;"></div>
<span class="material-symbols-outlined text-4xl text-primary-container z-10" data-icon="qr_code">qr_code</span>
</div>
<!-- Metadata Chip -->
<div class="bg-surface-container px-3 py-1 rounded-full font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center">
                        ECC Level M · Version 2
                    </div>
</div>
</div>
</div>
<!-- Primary Action (Sticky-ish bottom for mobile, flow for desktop) -->
<div class="mt-auto pt-xl w-full flex justify-center md:justify-end pb-safe">
<button class="w-full md:w-auto bg-primary-container text-on-primary font-label-sm text-label-sm px-xl py-4 rounded-lg shadow-sm hover:bg-primary transition-colors active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="download">download</span>
                Export QR Code
            </button>
</div>

<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="add_box" style="font-variation-settings: 'FILL' 1;">add_box</span>
<span class="font-label-sm text-label-sm mt-1">Create</span>
</a>
<!-- Inactive Tabs -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-sm text-label-sm mt-1">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</a>
</nav>

        // Optional JS to handle simple interactions if needed, currently structural padding handles nav clearance
